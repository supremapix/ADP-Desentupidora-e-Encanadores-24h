    <style>
      :root {
        /* CORES DO DESIGN SYSTEM */
        --color-primary: #9B111E;
        --color-primary-hover: #7A0D18;
        --color-accent: #FFC72C;
        --color-dark: #111111;
        --color-secondary: #FFEBB3;
        --color-light-gray: #FAF9F6;
        --color-whatsapp: #25D366;
        --color-whatsapp-hover: #1ebd59;

        /* TIPOGRAFIA */
        --font-primary-family: 'Barlow', 'Inter', sans-serif;
        --font-secondary-family: 'Barlow Condensed', sans-serif;
        
        --text-h1: 3rem;
        --text-h1-mobile: 2.25rem;
        --text-h2: 2.25rem;
        --text-h2-mobile: 1.75rem;
        --text-h3: 1.75rem;
        --text-h3-mobile: 1.4rem;
        --text-h4: 1.35rem;
        --text-h4-mobile: 1.15rem;
        
        --text-p: 1.05rem;
        --text-p-mobile: 0.95rem;
        --text-small: 0.875rem;
        --text-label: 0.75rem;
        
        --font-weight-title: 700;
        --font-weight-body: 400;
        
        --line-height-title: 1.1;
        --line-height-body: 1.6;
        
        --letter-spacing-uppercase: 0.08em;
        
        /* ESPAÇAMENTOS UNIFICADOS */
        --margin-title-subtitle: 1rem;
        --margin-subtitle-paragraph: 1.5rem;
        --padding-section: 5.5rem;
        --padding-section-mobile: 3rem;
        --gap-cards: 2rem;
        --gap-cards-mobile: 1.25rem;
        --padding-card: 2.5rem;
        --padding-card-mobile: 1.5rem;
      }

      /* Títulos Coesos do Design System */
      h1, .h1 {
        font-family: var(--font-secondary-family);
        font-size: var(--text-h1-mobile);
        font-weight: 800; /* Extra bold */
        line-height: var(--line-height-title);
        letter-spacing: var(--letter-spacing-uppercase);
        text-transform: uppercase;
      }
      @media (min-width: 768px) {
        h1, .h1 { font-size: var(--text-h1); }
      }

      h2, .h2 {
        font-family: var(--font-secondary-family);
        font-size: var(--text-h2-mobile);
        font-weight: 800;
        line-height: var(--line-height-title);
        letter-spacing: var(--letter-spacing-uppercase);
        text-transform: uppercase;
      }
      @media (min-width: 768px) {
        h2, .h2 { font-size: var(--text-h2); }
      }

      h3, .h3 {
        font-family: var(--font-secondary-family);
        font-size: var(--text-h3-mobile);
        font-weight: 700;
        line-height: var(--line-height-title);
        letter-spacing: var(--letter-spacing-uppercase);
        text-transform: uppercase;
      }
      @media (min-width: 768px) {
        h3, .h3 { font-size: var(--text-h3); }
      }

      h4, .h4 {
        font-family: var(--font-secondary-family);
        font-size: var(--text-h4-mobile);
        font-weight: var(--font-weight-title);
        line-height: var(--line-height-title);
        letter-spacing: var(--letter-spacing-uppercase);
        text-transform: uppercase;
      }
      @media (min-width: 768px) {
        h4, .h4 { font-size: var(--text-h4); }
      }

      /* Consistência do Corpo de Texto */
      p, .p-text {
        font-family: var(--font-primary-family);
        font-size: var(--text-p-mobile);
        font-weight: var(--font-weight-body);
        line-height: var(--line-height-body);
        color: #374151; /* Cinza escuro */
      }
      @media (min-width: 768px) {
        p, .p-text { font-size: var(--text-p); }
      }

      /* Temas escuros automáticos em parágrafos de destaque/containers escuros */
      .bg-dark p, .bg-slate-900 p, .bg-slate-950 p, .text-white p, p.text-slate-300 {
        color: #D1D5DB !important; /* Cinza claro */
      }

      small, .small-text {
        font-family: var(--font-primary-family);
        font-size: var(--text-small);
        line-height: var(--line-height-body);
      }

      label, .label-text {
        font-family: var(--font-secondary-family);
        font-size: var(--text-label);
        font-weight: var(--font-weight-title);
        letter-spacing: var(--letter-spacing-uppercase);
        text-transform: uppercase;
      }

      /* Seção Unificada */
      section, .section-layout {
        padding-top: var(--padding-section-mobile);
        padding-bottom: var(--padding-section-mobile);
      }
      @media (min-width: 768px) {
        section, .section-layout {
          padding-top: var(--padding-section);
          padding-bottom: var(--padding-section);
        }
      }

      /* Cartão (Card) Unificado */
      .card, .card-layout {
        background-color: #FFFFFF;
        border: 1px solid #E5E7EB;
        border-radius: 1rem;
        box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        padding: var(--padding-card-mobile);
        transition: all 0.25s ease;
      }
      @media (min-width: 768px) {
        .card, .card-layout {
          padding: var(--padding-card);
        }
      }
      .card:hover, .card-layout:hover {
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        transform: translateY(-4px);
      }

      /* Botões Padronizados do Design System */
      .btn-primary {
        background-color: var(--color-primary);
        color: #FFFFFF !important;
        font-family: var(--font-secondary-family);
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: var(--letter-spacing-uppercase);
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: none;
        outline: none;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: var(--color-primary-hover);
        transform: translateY(-1px);
      }
      .btn-primary:active {
        transform: translateY(1px);
      }

      .btn-whatsapp {
        background-color: var(--color-whatsapp);
        color: #FFFFFF !important;
        font-family: var(--font-secondary-family);
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: var(--letter-spacing-uppercase);
        padding: 1rem 2rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: none;
        outline: none;
        cursor: pointer;
      }
      .btn-whatsapp:hover {
        background-color: var(--color-whatsapp-hover);
        transform: translateY(-1px);
      }
      .btn-whatsapp:active {
        transform: translateY(1px);
      }

      /* Crachá (Badge) de Urgência */
      .badge {
        background-color: var(--color-accent);
        color: var(--color-dark) !important;
        font-family: var(--font-secondary-family);
        font-weight: 800;
        font-size: 0.75rem;
        padding: 0.3rem 0.9rem;
        border-radius: 2rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
      }

      /* Temas escuros automáticos */
      .bg-dark, .bg-slate-900, .bg-slate-950 {
        background-color: var(--color-dark) !important;
      }
      .bg-dark h1, .bg-dark h2, .bg-dark h3, .bg-dark h4,
      .bg-slate-900 h1, .bg-slate-900 h2, .bg-slate-900 h3, .bg-slate-900 h4,
      .bg-slate-950 h1, .bg-slate-950 h2, .bg-slate-950 h3, .bg-slate-950 h4 {
        color: #FFFFFF !important;
      }
      
      .stagger-layout {
        display: grid;
        gap: var(--gap-cards-mobile);
      }
      @media (min-width: 768px) {
        .stagger-layout {
          gap: var(--gap-cards);
        }
      }

      html { scroll-behavior: smooth; }
      .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
      .reveal.active { opacity: 1; transform: translateY(0); }
      
      /* Classes de Atraso para Efeito Cascata no Menu */
      .stagger-1 { animation-delay: 0.1s; }
      .stagger-2 { animation-delay: 0.15s; }
      .stagger-3 { animation-delay: 0.2s; }
      .stagger-4 { animation-delay: 0.25s; }
      .stagger-5 { animation-delay: 0.3s; }
      .stagger-6 { animation-delay: 0.35s; }

      /* Ajuste para evitar flickering em mobiles lentos */
      .mobile-menu-item { opacity: 0; }
      .is-open .mobile-menu-item { animation: fadeInRight 0.4s ease-out forwards; }
